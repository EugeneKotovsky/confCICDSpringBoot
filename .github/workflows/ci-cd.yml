name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: todo-cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test, and check coverage
        run: mvn -B -ntp verify

      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: todo-cicd-jar
          path: target/todo-cicd-*.jar
          if-no-files-found: error

  publish-image:
    name: Build and publish Docker image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/conf-cicd-spring-boot
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to test VM
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/conf-cicd-spring-boot
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_SSH_PORT: ${{ vars.VM_SSH_PORT || '22' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip deployment until VM secrets are configured
        if: env.VM_HOST == '' || env.VM_USER == '' || env.VM_SSH_KEY == ''
        run: |
          echo 'Deployment deferred: configure VM_HOST, VM_USER, and VM_SSH_KEY.' >> "$GITHUB_STEP_SUMMARY"

      - name: Configure SSH key
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy blue-green release
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != ''
        run: |
          SSH_OPTIONS="-i ~/.ssh/id_ed25519 -p $VM_SSH_PORT -o StrictHostKeyChecking=accept-new"
          ssh $SSH_OPTIONS "$VM_USER@$VM_HOST" 'mkdir -p ~/todo-cicd'
          scp $SSH_OPTIONS deploy/deploy-blue-green.sh "$VM_USER@$VM_HOST:~/todo-cicd/deploy-blue-green.sh"
          ssh $SSH_OPTIONS "$VM_USER@$VM_HOST" "chmod 700 ~/todo-cicd/deploy-blue-green.sh && IMAGE='$IMAGE_NAME' TAG='$GITHUB_SHA' bash ~/todo-cicd/deploy-blue-green.sh"

  notify:
    name: Publish result
    needs: [verify, publish-image, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        run: |
          echo '## CI/CD result' >> "$GITHUB_STEP_SUMMARY"
          echo "- Build and test: ${{ needs.verify.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image: ${{ needs.publish-image.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ needs.deploy.result }}" >> "$GITHUB_STEP_SUMMARY"
